[project]
name = "npa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "rtree",
    "scikit-image>=0.26.0",
    "scipy",
    "shapely",
    "trimesh",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npa"]

